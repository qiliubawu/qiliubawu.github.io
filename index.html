<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zhao Zixu — Frontend Portfolio</title>
    <meta name="description" content="赵紫旭 — 前端开发工程师作品集。macOS 桌面美学 + 拟人化微交互：唤醒 ZZX 文件夹，拆开作品盲盒。" />
    <meta name="theme-color" content="#F5F5F7" />
    <link rel="stylesheet" href="./desktop.css" />
  </head>
  <body>
    <!-- 流体微光背景 -->
    <div class="orbs" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
    </div>

    <!-- 顶部状态栏 -->
    <header class="menubar">
      <div class="mb-left">
        <span class="logo-mark" aria-hidden="true">Z</span>
        <span class="mb-name">Zhao Zixu</span>
        <span class="mb-sep">—</span>
        <span class="mb-role">Frontend Developer</span>
      </div>
      <div class="mb-right">
        <span class="mb-clock" id="clock">--月--日 周- --:--</span>
        <a class="mb-icon" href="https://github.com/qiliubawu" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-1.94c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
        </a>
        <a class="mb-icon" href="mailto:qiliubawu@outlook.com" aria-label="邮箱">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.6"/><path d="m3.2 7 8.8 6.2L20.8 7" stroke-linecap="round"/></svg>
        </a>
        <button class="theme-sw" id="themeSw" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">
          <span class="sw-track" aria-hidden="true"><span class="sw-knob"></span></span>
        </button>
      </div>
    </header>

    <!-- 桌面舞台 -->
    <main class="stage">
      <div class="scene" id="scene" data-state="sleep">
        <!-- 散开的项目文件（JS 注入） -->
        <div class="files" id="files"></div>

        <!-- ZZX 拟人化文件夹 -->
        <div class="folder" id="folder" role="button" tabindex="0"
             aria-label="ZZX 作品文件夹，按下以唤醒并展开全部作品">
          <div class="folder-body">
            <div class="folder-back"></div>

            <!-- 夹在背板与前盖之间的彩色文件顶边 -->
            <div class="peeks" aria-hidden="true">
              <span class="peek" style="--c:#0891b2"></span>
              <span class="peek" style="--c:#8b5cf6"></span>
              <span class="peek" style="--c:#D4AF37"></span>
            </div>

            <!-- 前盖 -->
            <div class="folder-front">
              <span class="cover-sheen" aria-hidden="true"></span>

              <div class="face" id="face" data-mood="calm" aria-hidden="true">
                <span class="eye">
                  <span class="arc"></span>
                  <span class="ball"><i class="pupil"></i></span>
                </span>
                <span class="eye">
                  <span class="arc"></span>
                  <span class="ball"><i class="pupil"></i></span>
                </span>
              </div>

              <div class="badge" aria-hidden="true">ZZX</div>
            </div>

            <!-- Zzz 气泡置于前盖之外，避免被 overflow:hidden 裁切 -->
            <div class="zzz" aria-hidden="true"><i>Z</i><i>z</i><i>z</i></div>
          </div>
        </div>

        <p class="hint" id="hint">点击文件夹，唤醒 ZZX</p>
      </div>
    </main>

    <!-- Quick Look 窗口 -->
    <div class="ql" id="ql" hidden>
      <div class="ql-window" id="qlWindow" role="dialog" aria-modal="true" aria-labelledby="qlTitle" tabindex="-1">
        <div class="ql-bar">
          <div class="lights">
            <button class="light red" type="button" data-act="close" aria-label="关闭" title="关闭"></button>
            <button class="light yellow" type="button" data-act="reload" aria-label="重新载入预览" title="重新载入预览"></button>
            <button class="light green" type="button" data-act="open" aria-label="在新标签页打开" title="在新标签页打开"></button>
          </div>
          <div class="ql-title" id="qlTitle">项目预览</div>
          <div class="ql-right">
            <button class="ql-link" id="qlOpen" type="button">在新标签页打开 ↗</button>
          </div>
        </div>
        <div class="ql-urlbar">
          <span class="url-pill"><span class="url-dot" aria-hidden="true"></span><span id="qlUrl">—</span></span>
        </div>
        <div class="ql-body">
          <iframe id="qlFrame" title="项目预览" referrerpolicy="no-referrer" loading="lazy"></iframe>
          <div class="ql-loading" id="qlLoading"><span class="spinner" aria-hidden="true"></span><span>正在载入预览…</span></div>
        </div>
      </div>
    </div>

    <noscript>
      <div class="noscript">本页需要启用 JavaScript 才能唤醒桌面文件夹。你也可以直接访问
        <a href="https://github.com/qiliubawu">GitHub</a> 查看全部源码。</div>
    </noscript>

    <script src="./desktop.js"></script>
  </body>
</html>
